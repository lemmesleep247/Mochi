name: Release

# Push a tag like v1.2.3 to trigger this automatically (always treated as a
# beta release for now — see the "channel" input below for how to change
# that). It builds a release APK for every ABI plus a universal one, and
# opens a DRAFT GitHub Release with all of them attached — nothing is
# published automatically; review the draft and hit "Publish" yourself.
#
# Can also be run manually from the Actions tab (workflow_dispatch) against
# an existing tag — useful for re-running a failed build or regenerating
# release notes without pushing a new tag — and lets you pick the channel
# explicitly.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3) — created automatically at the current commit if it doesn't exist yet"
        required: true
      channel:
        description: "Release channel"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

jobs:
  build-and-draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag, channel, and version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            CHANNEL="${{ inputs.channel }}"
          else
            TAG="${{ github.ref_name }}"
            CHANNEL="beta"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a vX.Y.Z tag (e.g. v1.2.3)."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Tag $TAG doesn't exist yet — creating it at $(git rev-parse --short HEAD)."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          else
            echo "::error::Tag $TAG not found, even though this run was triggered by pushing it."
            exit 1
          fi

          # Build exactly what the tag points at — important when re-running
          # manually for an older tag whose commit isn't the current HEAD.
          git checkout "$TAG"

          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($CHANNEL)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set — building unsigned release APKs."
          fi

      - name: Build release APKs (all ABIs + universal)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName="${{ steps.release.outputs.version_name }}" \
            -PappVersionCode="${{ steps.release.outputs.version_code }}" \
            -PmalClientId="${{ secrets.MAL_CLIENT_ID }}"

      - name: Extract changelog section for this version
        run: |
          VERSION="${{ steps.release.outputs.version_name }}"
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            HEADER="## [$VERSION]"
          else
            HEADER="## [Unreleased]"
          fi
          awk -v header="$HEADER" '
            $0 == header { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "--- release notes ---"
          cat release_notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Mochi ${{ steps.release.outputs.tag }}${{ steps.release.outputs.channel == 'beta' && ' (Beta)' || '' }}
          draft: true
          prerelease: ${{ steps.release.outputs.channel == 'beta' }}
          body_path: release_notes.md
          files: app/build/outputs/apk/release/*.apk
